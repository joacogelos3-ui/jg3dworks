<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="robots" content="noindex, nofollow">
  <title>JG3D Works | WhatsApp</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:Archivo;src:url("../fonts/archivo-400.ttf") format("truetype");font-weight:400;font-display:swap}
    @font-face{font-family:Archivo;src:url("../fonts/archivo-600.ttf") format("truetype");font-weight:600;font-display:swap}
    @font-face{font-family:"Space Mono";src:url("../fonts/space-mono-700.ttf") format("truetype");font-weight:700;font-display:swap}
    :root{--ink:#0b0c0d;--paper:#f3f1ec;--muted:#77746e;--line:#d9d5cd;--red:#f1252d;--green:#25d366}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;background:var(--ink);color:var(--ink);font-family:Archivo,Arial,sans-serif;display:grid;place-items:center;padding:24px;overflow-x:hidden}
    body:before{content:"";position:fixed;width:480px;height:480px;border-radius:50%;background:var(--red);filter:blur(150px);opacity:.18;right:-170px;top:-190px;pointer-events:none}
    body:after{content:"";position:fixed;inset:18px;border:1px solid #ffffff12;pointer-events:none}
    .card{position:relative;width:min(100%,520px);background:var(--paper);padding:42px;box-shadow:0 30px 90px #0009;overflow:hidden}
    .card:before{content:"";position:absolute;left:0;top:0;width:100%;height:5px;background:var(--red)}
    .brand{display:flex;align-items:center;justify-content:space-between;padding-bottom:28px;border-bottom:1px solid var(--line)}
    .brand img{display:block;width:142px;height:auto;filter:drop-shadow(0 7px 8px #0004)}
    .brand span{font:700 10px "Space Mono",monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
    .eyebrow{display:flex;align-items:center;gap:9px;margin-top:34px;color:var(--red);font:700 10px "Space Mono",monospace;letter-spacing:.13em;text-transform:uppercase}
    .eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--red)}
    h1{font-size:clamp(38px,8vw,56px);line-height:.96;letter-spacing:-.055em;margin:18px 0 20px;font-weight:600}
    h1 span{color:var(--muted)}
    .lead{color:#5f5c57;font-size:16px;line-height:1.6;margin:0 0 28px}
    .button{width:100%;min-height:58px;padding:15px 18px;background:var(--green);color:#062b15;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:12px;font:700 11px "Space Mono",monospace;letter-spacing:.04em;text-transform:uppercase;transition:transform .2s,filter .2s,box-shadow .2s;box-shadow:0 12px 28px #25d36633}
    .button:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 16px 34px #25d36648}
    .button svg{width:21px;height:21px;fill:currentColor}
    .progress{height:2px;margin-top:24px;background:var(--line);overflow:hidden}
    .progress i{display:block;width:100%;height:100%;background:var(--red);transform-origin:left;animation:progress 1.8s linear forwards}
    .preview .progress i{animation:none;transform:scaleX(0)}
    @keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .status{font:400 10px "Space Mono",monospace;color:var(--muted);line-height:1.6;margin:12px 0 0}
    .secondary{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);font:700 10px "Space Mono",monospace;text-transform:uppercase}
    .secondary-brand,.secondary a{display:flex;align-items:center;gap:9px}
    .secondary-brand span{color:var(--muted);font-weight:400}
    .secondary a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--red);padding-bottom:3px}
    .argentina-flag{width:25px;height:17px;flex:0 0 auto;border:1px solid #0b0c0d22}
    .instagram-icon{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:var(--red);stroke-width:1.8}
    .instagram-icon .instagram-dot{fill:var(--red);stroke:none}
    @media(max-width:520px){body{padding:14px}.card{padding:30px 24px}.brand img{width:118px}.brand span{font-size:8px}.secondary{gap:10px;font-size:8px}.secondary-brand,.secondary a{gap:6px}.argentina-flag{width:22px;height:15px}.instagram-icon{width:15px;height:15px}}
    @media(prefers-reduced-motion:reduce){.progress i{animation:none;transform:scaleX(1)}.button{transition:none}}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="brand">
      <img src="../assets/jg3d-logo.png" alt="JG3D Works">
      <span>Automotive 3D Design</span>
    </div>
    <div class="eyebrow"><i></i><span id="eyebrow">Direct contact</span></div>
    <h1 id="page-title">Opening<br><span>WhatsApp…</span></h1>
    <p class="lead" id="lead">You will be redirected to our current contact number.</p>
    <a class="button" id="whatsapp-link" href="https://wa.me/5493517887769?text=Hello%20JG3D%2C%20I%20found%20your%20designs%20on%20Cults3D%20and%20would%20like%20to%20make%20an%20inquiry." rel="noopener noreferrer">
      <svg viewBox="0 0 448 512" aria-hidden="true"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32 101.5 32 1.9 131.6 1.9 254c0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.8l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.4-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.7 184.6zm101.7-138.2c-5.5-2.8-32.8-16.1-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.3-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2s-9.7 1.4-14.8 6.9c-5.1 5.6-19.4 19-19.4 46.3s19.9 53.7 22.6 57.4c2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
      <span id="button-text">Continue to WhatsApp</span>
    </a>
    <div class="progress" aria-hidden="true"><i></i></div>
    <p class="status" id="status">If WhatsApp does not open automatically, use the button above.</p>
    <div class="secondary">
      <div class="secondary-brand">
        <svg class="argentina-flag" viewBox="0 0 30 20" role="img" aria-label="Argentina">
          <rect width="30" height="6.67" fill="#74acdf"/>
          <rect y="6.67" width="30" height="6.66" fill="#fff"/>
          <rect y="13.33" width="30" height="6.67" fill="#74acdf"/>
          <circle cx="15" cy="10" r="2.1" fill="#f6b40e"/>
        </svg>
        <span>JG3D Works · STL files only</span>
      </div>
      <a href="https://www.instagram.com/jg3d.works/" rel="noopener noreferrer">
        <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle class="instagram-dot" cx="17.4" cy="6.7" r="1"/>
        </svg>
        <span>Instagram ↗</span>
      </a>
    </div>
  </main>
  <script>
    (() => {
      const WHATSAPP_NUMBER = "5493517887769";
      const WHATSAPP_MESSAGE = "Hello JG3D, I found your designs on Cults3D and would like to make an inquiry.";
      const target = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(WHATSAPP_MESSAGE)}`;
      const preview = new URLSearchParams(location.search).get("preview") === "1";
      if (preview) document.getElementById("status").textContent = "Preview mode: automatic redirection is paused.";
      document.getElementById("whatsapp-link").href = target;
      if (preview) {
        document.body.classList.add("preview");
      } else {
        window.setTimeout(() => window.location.replace(target), 1800);
      }
    })();
  </script>
</body>
</html>
